services:
  planningyrd:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_RETRO_URL=${VITE_RETRO_URL:-}
        - VITE_DAILY_URL=${VITE_DAILY_URL:-}
        - VITE_PLANNING_URL=${VITE_PLANNING_URL:-}
        - VITE_COFFEE_URL=${VITE_COFFEE_URL:-}
    container_name: planningyrd-app
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/planningyrd.db
      - RUST_LOG=info,tower_http=info
      - ROOM_RETENTION_DAYS=60
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - planning-data:/app/data

volumes:
  planning-data:
    driver: local
