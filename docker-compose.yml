services:
  planningyrd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planningyrd-app
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/planningyrd.db
      - RUST_LOG=info,tower_http=info
      - ROOM_RETENTION_DAYS=60
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - planning-data:/app/data

volumes:
  planning-data:
    driver: local
